<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .floating-label-container {
            position: relative;
        }
        
        .floating-label-container input:focus ~ label,
        .floating-label-container input:not(:placeholder-shown) ~ label {
            transform: translateY(-22px) scale(0.85);
            background-color: white;
            padding: 0 4px;
            color: #0038ca;
            font-weight: 500;
        }

        .floating-label-container label {
            position: absolute;
            left: 12px;
            top: 14px;
            transition: all 0.2s ease-out;
            pointer-events: none;
        }

        .login-card {
            box-shadow: 0 2px 8px 0 rgba(17, 28, 45, 0.06);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md overflow-x-hidden">
<!-- Top AppBar (Identity Shell) -->
<header class="flex justify-between items-center w-full px-container-padding h-14 bg-surface fixed top-0 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<h1 class="text-headline-md font-headline-md font-bold text-primary">LOT Field Collection</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-[20px]">security</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-container-padding py-xl mt-14">
<div class="w-full max-w-[400px] flex flex-col gap-lg">
<!-- Hero / Welcome Section -->
<div class="text-center space-y-sm">
<div class="w-20 h-20 bg-primary-container/10 rounded-2xl flex items-center justify-center mx-auto mb-md">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
</div>
<h2 class="font-headline-md-mobile text-headline-md-mobile text-on-background">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Access your secure agent dashboard</p>
</div>
<!-- Login Form Card -->
<div class="bg-white rounded-xl p-lg login-card border border-outline-variant/30">
<form class="flex flex-col gap-md" id="loginForm">
<!-- Email Field -->
<div class="floating-label-container">
<input class="w-full h-12 px-md pt-2 border border-outline-variant rounded-lg focus:border-primary focus:ring-0 transition-colors peer bg-transparent font-body-md text-body-md" id="email" placeholder=" " type="email"/>
<label class="font-body-md text-body-md text-on-surface-variant" for="email">Email Address</label>
</div>
<!-- Password Field -->
<div class="floating-label-container">
<input class="w-full h-12 px-md pt-2 border border-outline-variant rounded-lg focus:border-primary focus:ring-0 transition-colors peer bg-transparent font-body-md text-body-md" id="password" placeholder=" " type="password"/>
<label class="font-body-md text-body-md text-on-surface-variant" for="password">Password</label>
<button class="absolute right-3 top-3 text-secondary" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
<!-- Options -->
<div class="flex items-center justify-between mt-xs">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary-container transition-all" type="checkbox"/>
</div>
<span class="font-label-md text-label-md text-secondary group-hover:text-primary transition-colors">Remember Me</span>
</label>
<a class="font-label-md text-label-md text-primary font-semibold hover:underline" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="mt-md h-12 bg-primary text-on-primary font-title-lg text-title-lg rounded-full shadow-lg active:scale-[0.98] transition-all hover:bg-primary-container flex items-center justify-center gap-2" id="loginBtn" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
</div>
<!-- SSO / Support -->
<div class="flex flex-col gap-sm">
<button class="w-full h-12 border border-outline-variant rounded-full flex items-center justify-center gap-3 font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors">
<img class="w-5 h-5" data-alt="Official Google logo icon representing G-Suite single sign-on authentication for enterprise level security. The logo is crisp and set against a minimalist fintech interface background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYVYQIJYwstJDnmegtCe66G3G6VsNyR_ieOe3YaEwApOgPoaD0aCqK9EdIsaoXRIWrO3Ivcc9ih3QQ-yhzYS5zZhnXDcYMch5hsatWyxGsLvaYGx_oZyXfbAUEFjCppUBGL-ufp1JxFtbyEZkL5YcuFQ7ppWOM5Vr8YhxNW_jzGilgP-LlWiTniLKOCwWkSzt6P7Ytmw1x0zMMxoGctNsT8lD7mRge9l1jG-7V5b5hntHoP-zb_H2CIuUBC_lTo9jNpEABQuTVqZwm"/>
<span>Sign in with Google Workspace</span>
</button>
<p class="text-center font-label-md text-label-md text-outline py-md">
                    Secured by 256-bit AES Encryption
                </p>
</div>
</div>
</main>
<!-- Footer Identity -->
<footer class="w-full py-md px-container-padding flex flex-col items-center gap-xs">
<p class="font-label-md text-label-md text-outline">v 4.2.0-stable</p>
<div class="flex gap-md">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary" href="#">Privacy Policy</a>
<span class="text-outline-variant">•</span>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary" href="#">Support</a>
</div>
</footer>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const pwdIcon = document.getElementById('passwordIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdIcon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                pwdIcon.textContent = 'visibility';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const originalContent = btn.innerHTML;
            
            // Visual Interaction
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success';
                btn.classList.replace('bg-primary', 'bg-tertiary-container');
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-tertiary-container', 'bg-primary');
                    btn.disabled = false;
                }, 1500);
            }, 1200);
        });
    </script>
</body></html>

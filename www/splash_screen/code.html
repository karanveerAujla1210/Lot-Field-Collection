<style>
        @keyframes fadeInScale {

            0% { transform: translateY(20px); opacity: 0; }

            0% { transform: translateX(-100%); }

<!-- Micro-interaction Script -->
<script>
        // Simulating a delay before transition (Splash logic)
        document.addEventListener('DOMContentLoaded', () => {
            console.log('FinCollect Splash Initialized');
            
            // Interaction: Subtle tilt on logo based on mouse movement (Desktop Only)
            if (window.innerWidth > 768) {
                const container = document.querySelector('main');
                const logo = document.querySelector('.w-20');
                
                container.addEventListener('mousemove', (e) => {
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                    logo.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                });

                container.addEventListener('mouseleave', () => {
                    logo.style.transform = `rotateY(0deg) rotateX(0deg)`;
                    logo.style.transition = 'transform 0.5s ease';
                });
            }
        });
    </script>

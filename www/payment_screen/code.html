<body class="bg-surface text-on-surface min-h-screen pb-24">
<!-- Top App Bar -->
<header class="bg-surface sticky top-0 z-50 flex justify-between items-center w-full px-container-padding h-14">
<div class="flex items-center gap-3">
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors Active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary">LOT Field Collection</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant">sync</span>
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container font-bold overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial executive with a friendly yet authoritative expression. The individual is wearing a sharp, navy blue suit against a clean, soft-lit office background with blurred architectural details. The lighting is bright and modern, emphasizing trust and competence. The high-resolution image reflects a high-end fintech brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDvfnend2fqcGHs232Fjpajli9R2CKR4Cvl0gojbHCnnIu-65ONKLVyd2hODcMSLRyQdJnHeZf3SXAkP0R-iWY-joK6W26Dv8KpTwJn9otifFkSkJtu7AFBX1I7XI3b99_lBrf_6DqdGF_PnTV7WwybWM-w-4uR5KdzkoEn5thnX5BOGLREb29UsX0xRc5RpG5cnPKC39_NeUoZ2ZwWIyG1smDVpbvWinzMB6DR30Ob048VyEeXja3PlMO4MmEwA0u7J04aKh6rQZNh"/>
</div>
</div>
</header>
<main class="max-w-md mx-auto px-container-padding pt-6 space-y-6">
<!-- Customer & Loan Brief -->
<div class="bg-surface-container-lowest rounded-xl p-md border border-outline-variant shadow-sm border-l-4 border-l-primary">
<div class="flex justify-between items-start mb-2">
<div>
<h2 class="font-title-lg text-title-lg text-on-surface">Rajesh Kumar</h2>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Loan ID: FC-99283-K</p>
</div>
<div class="bg-tertiary-container text-on-tertiary px-3 py-1 rounded-full font-label-md text-label-md">
          Active
        </div>
</div>
<div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-surface-variant">
<div>
<p class="font-label-md text-label-md text-on-surface-variant">Outstanding</p>
<p class="font-headline-sm text-headline-sm text-primary">₹42,500.00</p>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface-variant">Current EMI</p>
<p class="font-headline-sm text-headline-sm text-on-surface">₹8,500.00</p>
</div>
</div>
</div>
<!-- Payment Input -->
<section class="space-y-4">
<h3 class="font-title-lg text-title-lg text-on-surface px-1">Collection Details</h3>
<div class="relative group">
<label class="absolute -top-2 left-3 bg-white px-1 text-xs font-medium text-primary z-10 transition-all">Payment Amount (₹)</label>
<div class="flex items-center border-2 border-primary rounded-lg px-3 py-3 shadow-sm bg-white">
<span class="text-xl font-semibold text-on-surface mr-2">₹</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-headline-md text-headline-md text-on-surface p-0" placeholder="0.00" type="number" value="8500"/>
</div>
</div>
<!-- Payment Mode Selection -->
<div class="space-y-3">
<p class="font-label-md text-label-md text-on-surface-variant font-semibold uppercase tracking-widest px-1">Select Payment Mode</p>
<div class="grid grid-cols-2 gap-3">
<!-- Cash -->
<div>
<input checked="" class="hidden payment-mode-radio" id="mode_cash" name="payment_mode" onchange="toggleFields('cash')" type="radio"/>
<label class="flex flex-col items-center justify-center p-4 border border-outline-variant rounded-xl bg-white cursor-pointer hover:bg-surface-container-low transition-all" for="mode_cash">
<span class="material-symbols-outlined text-on-surface-variant mb-2">payments</span>
<span class="font-label-md text-label-md">Cash</span>
</label>
</div>
<!-- UPI -->
<div>
<input class="hidden payment-mode-radio" id="mode_upi" name="payment_mode" onchange="toggleFields('upi')" type="radio"/>
<label class="flex flex-col items-center justify-center p-4 border border-outline-variant rounded-xl bg-white cursor-pointer hover:bg-surface-container-low transition-all" for="mode_upi">
<span class="material-symbols-outlined text-on-surface-variant mb-2">qr_code_2</span>
<span class="font-label-md text-label-md">UPI</span>
</label>
</div>
<!-- Cheque -->
<div>
<input class="hidden payment-mode-radio" id="mode_cheque" name="payment_mode" onchange="toggleFields('cheque')" type="radio"/>
<label class="flex flex-col items-center justify-center p-4 border border-outline-variant rounded-xl bg-white cursor-pointer hover:bg-surface-container-low transition-all" for="mode_cheque">
<span class="material-symbols-outlined text-on-surface-variant mb-2">receipt_long</span>
<span class="font-label-md text-label-md">Cheque</span>
</label>
</div>
<!-- NEFT/IMPS -->
<div>
<input class="hidden payment-mode-radio" id="mode_neft" name="payment_mode" onchange="toggleFields('neft')" type="radio"/>
<label class="flex flex-col items-center justify-center p-4 border border-outline-variant rounded-xl bg-white cursor-pointer hover:bg-surface-container-low transition-all" for="mode_neft">
<span class="material-symbols-outlined text-on-surface-variant mb-2">account_balance</span>
<span class="font-label-md text-label-md">NEFT/IMPS</span>
</label>
</div>
</div>
</div>
<!-- Contextual Fields Container -->
<div class="space-y-4 animate-in fade-in slide-in-from-top-2 duration-300" id="contextual_fields">
<!-- UPI Fields (Hidden by default) -->
<div class="hidden space-y-4" id="fields_upi">
<div class="relative">
<label class="font-label-md text-label-md text-on-surface-variant block mb-1 ml-1">UTR / Transaction ID</label>
<input class="w-full p-3 bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" placeholder="Enter 12-digit UPI UTR" type="text"/>
</div>
</div>
<!-- Cheque Fields (Hidden by default) -->
<div class="hidden space-y-4" id="fields_cheque">
<div class="grid grid-cols-2 gap-3">
<div class="relative">
<label class="font-label-md text-label-md text-on-surface-variant block mb-1 ml-1">Cheque Number</label>
<input class="w-full p-3 bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" placeholder="6-digit no." type="text"/>
</div>
<div class="relative">
<label class="font-label-md text-label-md text-on-surface-variant block mb-1 ml-1">Cheque Date</label>
<input class="w-full p-3 bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" type="date"/>
</div>
</div>
<div class="relative">
<label class="font-label-md text-label-md text-on-surface-variant block mb-1 ml-1">Bank Name</label>
<input class="w-full p-3 bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" placeholder="e.g. HDFC Bank" type="text"/>
</div>
</div>
<!-- NEFT/IMPS Fields (Hidden by default) -->
<div class="hidden space-y-4" id="fields_neft">
<div class="relative">
<label class="font-label-md text-label-md text-on-surface-variant block mb-1 ml-1">Transaction Reference Number</label>
<input class="w-full p-3 bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md" placeholder="Enter Reference No." type="text"/>
</div>
</div>
</div>
<!-- Receipt Upload -->
<div class="space-y-3">
<p class="font-label-md text-label-md text-on-surface-variant font-semibold uppercase tracking-widest px-1">Proof of Payment</p>
<button class="w-full border-2 border-dashed border-outline-variant rounded-xl p-8 bg-surface-container-low flex flex-col items-center justify-center gap-2 hover:bg-surface-variant transition-colors group" onclick="document.getElementById('file_upload').click()">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary transition-colors">add_a_photo</span>
<span class="font-label-md text-label-md text-on-surface-variant">Upload Receipt / Screenshot</span>
<input accept="image/*" class="hidden" id="file_upload" type="file"/>
</button>
</div>
</section>
<!-- Confirmation Checkbox -->
<div class="flex items-start gap-3 p-1">
<input class="mt-1 w-5 h-5 text-primary border-outline-variant rounded focus:ring-primary" id="confirm_details" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant leading-tight" for="confirm_details">
        I confirm that I have collected the mentioned amount from the customer and verified the payment details.
      </label>
</div>
<!-- Action Button -->
<div class="pt-4 pb-12">
<button class="w-full h-[56px] bg-primary text-white rounded-full font-headline-sm text-headline-sm shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 hover:brightness-110">
<span>Confirm Payment</span>
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 pb-safe px-2 bg-surface-container border-t border-outline-variant z-50">
<a class="flex flex-col items-center justify-center text-secondary px-5 py-1 hover:bg-surface-container-high rounded-full transition-all duration-200" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">groups</span>
<span class="font-label-md text-label-md">Customers</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary px-5 py-1 hover:bg-surface-container-high rounded-full transition-all duration-200" href="#">
<span class="material-symbols-outlined">event_repeat</span>
<span class="font-label-md text-label-md">Follow Ups</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary px-5 py-1 hover:bg-surface-container-high rounded-full transition-all duration-200" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-md text-label-md">History</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary px-5 py-1 hover:bg-surface-container-high rounded-full transition-all duration-200" href="#">
<span class="material-symbols-outlined">account_circle</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
<script>
    function toggleFields(mode) {
      const modes = ['upi', 'cheque', 'neft'];
      modes.forEach(m => {
        const el = document.getElementById(`fields_${m}`);
        if (el) {
          if (m === mode) {
            el.classList.remove('hidden');
          } else {
            el.classList.add('hidden');
          }
        }
      });
    }

    // Interactive FAB suppression on details page as per guidelines
    // (Handled by omitting the FAB in this specific task-focused screen)

    // Visual feedback for file selection
    document.getElementById('file_upload').addEventListener('change', function(e) {
      if (e.target.files && e.target.files[0]) {
        const btn = e.target.closest('button');
        btn.innerHTML = `
          <span class="material-symbols-outlined text-4xl text-tertiary">check_circle</span>
          <span class="font-label-md text-label-md text-tertiary">Receipt Attached: ${e.target.files[0].name}</span>
        `;
        btn.classList.replace('bg-surface-container-low', 'bg-tertiary-fixed-dim');
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../src/bridge/fincollect-bridge.js"></script>
</body></html>

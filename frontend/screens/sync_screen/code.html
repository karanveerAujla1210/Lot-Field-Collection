<script>
        // Micro-interaction for the Sync button
        const syncBtn = document.getElementById('sync-button');
        syncBtn.addEventListener('click', () => {
            const originalText = syncBtn.innerHTML;
            syncBtn.disabled = true;
            syncBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">autorenew</span> Optimizing...';
            
            setTimeout(() => {
                syncBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Sync Initiated';
                syncBtn.classList.remove('bg-primary');
                syncBtn.classList.add('bg-tertiary');
                
                setTimeout(() => {
                    syncBtn.innerHTML = originalText;
                    syncBtn.classList.add('bg-primary');
                    syncBtn.classList.remove('bg-tertiary');
                    syncBtn.disabled = false;
                }, 2000);
            }, 1500);
        });

        // Simulating subtle data updates
        setInterval(() => {
            const bar = document.querySelector('.bg-primary.transition-all');
            const percentText = document.querySelector('.text-title-lg');
            let currentWidth = parseInt(bar.style.width);
            if(currentWidth < 100) {
                currentWidth += 1;
                bar.style.width = currentWidth + '%';
                percentText.innerText = currentWidth + '%';
            } else {
                bar.style.width = '0%';
                percentText.innerText = '0%';
            }
        }, 5000);
    </script>
